name: Probe Runners

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Info
        run: |
          echo "runner=${{ matrix.os }}"
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true
