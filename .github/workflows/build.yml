name: Build Signdrop IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build .app (unsigned, device)
        run: |
          set -uo pipefail
          xcodebuild -project Signdrop.xcodeproj \
            -scheme Signdrop \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" \
            build > build.log 2>&1
          STATUS=$?
          echo "===== ERRORS ====="
          grep -nE "error:" build.log | head -60 || true
          echo "===== LAST 30 LINES ====="
          tail -30 build.log || true
          echo "===== /ERRORS ====="
          grep -q "BUILD SUCCEEDED" build.log || exit 1
          test $STATUS -eq 0 || exit 1

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          set -euo pipefail
          grep -q "BUILD SUCCEEDED" build.log || { echo "构建未通过，查看上方错误"; exit 1; }
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          ls -la Payload/Signdrop.app/ | head -30
          test -f Payload/Signdrop.app/AppleWWDRCAG4.cer && echo "WWDR G4 bundled" || echo "WARN: missing WWDR G4"
          zip -qry Signdrop.ipa Payload
          ls -la Signdrop.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Signdrop-ipa
          path: Signdrop.ipa

      - name: Create release and upload IPA
        run: |
          gh release view v1.5.0 2>/dev/null || \
            gh release create v1.5.0 --title "Signdrop v1.5.0" \
              --notes "Signdrop iOS 自签名工具 · 未签名 IPA（需用 Apple ID 通过 Sideloadly/AltStore 安装）" \
              --target $GITHUB_SHA
          gh release upload v1.5.0 Signdrop.ipa --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
